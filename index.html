<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>JS Game</title>
</head>

<body>
    <canvas id="confete" aria-hidden="true"></canvas>

    <div class="container">
        <header class="container__topo">
            <div class="niveis" role="group" aria-label="Nível de dificuldade">
                <button class="nivel nivel--ativo" data-nivel="facil">Fácil</button>
                <button class="nivel" data-nivel="medio">Médio</button>
                <button class="nivel" data-nivel="hacker">Hacker</button>
            </div>
            <button id="voz" class="voz" aria-pressed="true" title="Ligar/desligar voz">🔊 Voz</button>
        </header>

        <div class="container__conteudo">
            <div class="container__informacoes">
                <div class="container__texto">
                    <h1 id="titulo">Adivinhe o <span class="container__texto-azul">número secreto</span></h1>
                    <p id="mensagem" class="texto__paragrafo">Escolha um número entre 1 e 10</p>
                </div>

                <div class="status">
                    <span>🎯 Tentativas: <strong id="tentativas">0/4</strong></span>
                    <span>⏱️ <strong id="tempo">0.0s</strong></span>
                </div>

                <div class="termometro" aria-hidden="true">
                    <div id="termometro-barra" class="termometro__barra"></div>
                    <span id="termometro-rotulo" class="termometro__rotulo">Faça seu primeiro chute</span>
                </div>

                <div class="faixa" aria-hidden="true">
                    <div id="faixa-possivel" class="faixa__possivel"></div>
                    <span id="faixa-min" class="faixa__min">1</span>
                    <span id="faixa-max" class="faixa__max">10</span>
                </div>

                <form id="form-chute" class="chute">
                    <input id="chute" type="number" min="1" max="10" class="container__input"
                        placeholder="Seu chute" autocomplete="off" inputmode="numeric">
                    <div class="container__botoes">
                        <button type="submit" id="chutar" class="container__botao">Chutar</button>
                        <button type="button" id="reiniciar" class="container__botao" disabled>Novo jogo</button>
                    </div>
                </form>
            </div>

            <aside class="ranking">
                <img src="./img/ia.png" alt="Uma pessoa olhando para a esquerda" id="personagem"
                    class="container__imagem-pessoa" />
                <h2>🏆 Ranking <span id="ranking-nivel">Fácil</span></h2>
                <ol id="ranking-lista"></ol>
            </aside>
        </div>
    </div>

    <script src="app.js" defer></script>
</body>

</html>
